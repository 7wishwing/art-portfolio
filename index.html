<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="허규 — 시각예술 포트폴리오" />
    <title>허규</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
          <a class="logo" href="#works" data-view="works">허규</a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="#works" data-view="works">Works</a>
        <a href="#about" data-view="about">About</a>
        <a href="#cv" data-view="cv">CV</a>
      </nav>
    </header>

    <main id="main">
      <section id="works-view" class="view is-active" aria-label="작품">
        <h1 class="visually-hidden">Works</h1>
        <nav id="category-nav" class="category-nav" aria-label="작품 분류"></nav>
        <div id="works-grid" class="works-grid"></div>
      </section>

      <section id="about-view" class="view" hidden aria-label="소개">
        <article class="about">
          <p class="about-name" id="about-name"></p>
          <p class="about-location" id="about-location"></p>
          <div class="about-statement" id="about-statement"></div>
          <p class="about-bio" id="about-bio"></p>
          <ul class="about-links">
            <li><a id="about-email" href="mailto:hello@example.com">Email</a></li>
            <li><a id="about-instagram" href="#" target="_blank" rel="noopener noreferrer">Instagram</a></li>
          </ul>
        </article>
      </section>

      <section id="cv-view" class="view" hidden aria-label="이력">
        <article class="about cv">
          <p class="about-name" id="cv-name"></p>
          <p class="about-location">Artist CV</p>
          <div id="cv-sections"></div>
        </article>
      </section>

      <section id="detail-view" class="view" hidden aria-label="작품 상세">
        <article class="detail">
          <a class="detail-back" href="#works">← Works</a>
          <figure class="detail-figure" id="detail-figure">
            <img id="detail-image" alt="" />
          </figure>
          <div id="detail-gallery" class="detail-gallery" hidden></div>
          <div class="detail-meta">
            <h1 id="detail-title" class="detail-title"></h1>
            <dl class="spec" id="detail-spec">
              <div>
                <dt>연도</dt>
                <dd id="detail-year"></dd>
              </div>
              <div>
                <dt>재료</dt>
                <dd id="detail-medium"></dd>
              </div>
              <div>
                <dt id="detail-size-label">크기</dt>
                <dd id="detail-size"></dd>
              </div>
            </dl>
            <p id="detail-description" class="detail-description"></p>
            <nav class="detail-nav" aria-label="다른 작품">
              <a id="detail-prev" href="#">← Prev</a>
              <a id="detail-next" href="#">Next →</a>
            </nav>
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p id="footer-copy"></p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
